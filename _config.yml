title: "Indicateurs ODD — Sénégal"
description: "Plateforme nationale de suivi des ODD au Sénégal. ANSD / DMCI."
baseurl: "/odd-senegal-site"
url: "https://ndaosaer.github.io"

remote_theme: open-sdg/open-sdg@2.3.0
remote_data_prefix: "https://ndaosaer.github.io/odd-senegal-data"

languages:
  - fr

translations:
  - class: TranslationInputSdgTranslations
    source: https://github.com/open-sdg/sdg-translations.git
    tag: "2.0.0"
  - class: TranslationInputYaml
    source: translations

plugins:
  - jekyll-remote-theme
  - jekyll-open-sdg-plugins

collections:
  indicators:
    output: true
  goals:
    output: true
  pages:
    output: true
  posts:
    output: true

create_indicators:
  layout: indicator

create_goals:
  layout: goal

create_pages: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts

sdg_build_js_translations: false
