# Jekyll configuration for Open SDG platform

# Tell the Remote Theme plugin to use the Open SDG platform (Jekyll theme).
remote_theme: open-sdg/open-sdg@2.4.0

# Replace this title as needed.
title: general.site_title
url: "https://ndaosaer.github.io"
baseurl: "/odd-senegal-site"
environment: staging

# Tell the platform where to find the hosted data repository.
# This points to the GitHub Pages output of odd-senegal-data.
remote_data_prefix: https://ndaosaer.github.io/odd-senegal-data

# Pages
collections:
  pages:
    output: true
    permalink: /:path/
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title.html
  indicators:
    output: true
  goals:
    output: true

# Tell Jekyll to use the Remote Theme plugin.
plugins:
  - jekyll-remote-theme
  - jekyll-open-sdg-plugins

# Exclude some files/folders.
exclude:
  - vendor
  - scripts
  - remotedata
  - Gemfile
  - Gemfile.lock
  - README
  - README.md
  - LICENSE
