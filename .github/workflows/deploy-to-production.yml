name: Deploy to production

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
  repository_dispatch:
    types: [data-update]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: false

      - name: Install gems
        run: bundle install

      - name: Pre-build to download remote theme
        run: bundle exec jekyll build --config _config.yml 2>&1 | head -10 || true

      - name: Patch schema.yml everywhere
        run: |
          SCHEMA='- name: reporting_status
  field: reporting_status
  label: Reporting Status
  widget: select
- name: indicator_name
  field: indicator_name
  label: Indicator Name
  widget: text
- name: indicator_number
  field: indicator_number
  label: Indicator Number
  widget: text
- name: target_id
  field: target_id
  label: Target
  widget: text
- name: national_geographical_coverage
  field: national_geographical_coverage
  label: Geographic Coverage
  widget: text
- name: computation_units
  field: computation_units
  label: Unit of Measurement
  widget: text
- name: source_active_1
  field: source_active_1
  label: Source Active
  widget: boolean
- name: source_organisation_1
  field: source_organisation_1
  label: Source Organisation
  widget: text'

          echo "$SCHEMA" > _data/schema.yml

          for f in $(find . -name "schema.yml" 2>/dev/null); do
            echo "Patching: $f"
            echo "$SCHEMA" > "$f"
          done

          for f in $(find /tmp /home/runner /root -name "schema.yml" 2>/dev/null); do
            echo "Patching cache: $f"
            echo "$SCHEMA" > "$f"
          done

          echo "=== schema.yml final ==="
          cat _data/schema.yml

      - name: Build Jekyll site
        run: bundle exec jekyll build --config _config.yml --future
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
